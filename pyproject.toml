[project]
name = "mstsc-manager"
version = "0.1.3"
description = "远程桌面(mstsc)连接管理器，支持 SSH 本地端口转发隧道"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "loguru>=0.7",
    "paramiko>=3.4",
]

[project.scripts]
mstsc-manager = "mstsc_manager.__main__:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mstsc_manager"]

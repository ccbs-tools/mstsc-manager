name: Build (PyInstaller)

# 触发方式：
#   1) 在 Actions 页面手动点 "Run workflow"（workflow_dispatch）：只打包，产物在 Artifacts
#   2) 推送 v 开头的 tag（如 v0.1.0）：打包并发布 Release 到本仓库
#
# 发版步骤见 dev.md（__init__.py / pyproject.toml / changelog.py 三处版本号要一致）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # 在本仓库创建 Release 需要

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $v = $env:GITHUB_REF -replace "refs/tags/v?", ""
          } else {
            $v = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"(.+)"').Matches.Groups[1].Value
            $v = "$v+$($env:GITHUB_SHA.Substring(0,7))"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version = $v"

      - name: Check version consistency (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          $py = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"(.+)"').Matches.Groups[1].Value
          $init = (Select-String -Path mstsc_manager/__init__.py -Pattern '__version__\s*=\s*"(.+)"').Matches.Groups[1].Value
          Write-Host "tag=$env:VER pyproject=$py __init__=$init"
          if ($py -ne $env:VER -or $init -ne $env:VER) {
            Write-Error "version mismatch: tag=$env:VER pyproject=$py __init__=$init (see dev.md)"
            exit 1
          }

      - name: Build with PyInstaller
        run: uv run pyinstaller main.spec --noconfirm

      - name: Package zip
        id: pack
        shell: pwsh
        run: |
          $name = "mstsc-manager-v${{ steps.ver.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path dist/mstsc-manager/* -DestinationPath $name -Force
          "zip=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "packed $name"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mstsc-manager-windows-x64
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error
          retention-days: 7

      # ---------- 以下仅在推 tag 时执行：发布到本仓库 Releases ----------

      - name: Release notes from changelog.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          PYTHONUTF8: "1"   # Windows runner 默认 cp1252，print 中文会崩
          VER: ${{ steps.ver.outputs.version }}
          ZIP: ${{ steps.pack.outputs.zip }}
        run: |
          @'
          import os
          from mstsc_manager.changelog import RELEASES, release_notes

          ver, zip_name = os.environ["VER"], os.environ["ZIP"]
          entry = next((e for e in RELEASES if e["version"] == ver), None)
          lines = [f"## mstsc-manager v{ver}", ""]
          if entry is None:
              lines.append(f"（changelog.py 中没有 {ver} 的条目，请补充 RELEASES）")
          else:
              lines.append(f"发布日期 / Date: {entry.get('date', '')}")
              lines += ["", "### 更新内容"] + [f"- {s}" for s in release_notes(entry, "zh")]
              lines += ["", "### Changes"] + [f"- {s}" for s in release_notes(entry, "en")]
          lines += ["", "### 下载 / Download", f"- Windows x64: `{zip_name}`（解压后运行 mstsc-manager.exe）",
                    "- 校验: `SHA256SUMS.txt`"]
          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print(open("RELEASE_NOTES.md", encoding="utf-8").read())
          '@ | Set-Content -Path release_notes.py -Encoding UTF8
          uv run python release_notes.py

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.pack.outputs.zip }}
        run: |
          set -euo pipefail
          sha256sum "$ZIP" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$TAG" "$ZIP" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "mstsc-manager $TAG" \
            --notes-file RELEASE_NOTES.md
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
